name: deploy-payments

# Деплой Cloudflare Worker, который принимает оплату Telegram Stars.
# Пока в репозитории нет секрета CLOUDFLARE_API_TOKEN, шаг деплоя пропускается —
# workflow остаётся безопасным и ничего не ломает.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-payments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Тесты оплаты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node worker/test/payments.test.mjs

  deploy:
    name: Деплой воркера
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Проверить наличие секрета
        id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Деплой
        if: steps.token.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Подсказка, если секрета нет
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN не задан — деплой пропущен. Добавь секрет, чтобы включать его автоматически."
