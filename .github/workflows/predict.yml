name: daily-predictions
on:
  schedule:
    - cron: '5 */2 * * *'   # каждые 2 часа (05:05, 07:05, 09:05 МСК...) — витрина всегда свежая, события минимум за 6 часов до старта
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-predictions
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Тесты модели (выбор рынка, калибровка, домашний фактор)
        run: node test/model.test.mjs
      - name: Generate predictions
        run: node scripts/generate-predictions.mjs
      # PRO-прогнозы уходят в KV воркера и в репозиторий не попадают (data/pro-feed.json
      # в .gitignore): иначе VIP-контент скачивался бы curl-ом без подписки.
      - name: Publish VIP feed to worker KV
        env:
          PXAX_WORKER_URL: ${{ secrets.PXAX_WORKER_URL }}
          PXAX_ADMIN_KEY: ${{ secrets.PXAX_ADMIN_KEY }}
        run: node scripts/publish-pro.mjs
      - name: Resolve yesterday results
        env:
          # резолверу VIP-фид нужен, чтобы PRO-история не выпадала из статистики
          PXAX_WORKER_URL: ${{ secrets.PXAX_WORKER_URL }}
          PXAX_ADMIN_KEY: ${{ secrets.PXAX_ADMIN_KEY }}
        run: node scripts/resolve-results.mjs
      # Пейвол: value/edge/impliedProb и фраза «перевес модели» — платный сигнал PRO.
      # Проверяем публичные файлы ДО коммита: если утечка вернулась, пайплайн падает
      # и ничего не публикуется, вместо того чтобы молча выложить VIP-ставки.
      - name: Проверить, что в публичных данных нет платного сигнала PRO
        run: node scripts/check-public-feed.mjs
      - name: Commit data
        run: |
          git config user.name "pxax-bot"
          git config user.email "bot@pxax.local"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
